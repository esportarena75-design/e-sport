name: CI

on:
  push:
    branches: [main, claude/finition]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Le client Supabase exige ces variables au chargement ; des valeurs factices suffisent ici.
      # Chaque étape recopie sa sortie dans une annotation : le détail reste lisible via l'API
      # GitHub (check-runs/<id>/annotations) même quand les logs ne sont pas accessibles.
      - name: Typecheck
        shell: bash
        run: |
          npm run typecheck 2>&1 | tee out.txt || { echo "::error title=Typecheck::$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' out.txt | head -c 30000)"; exit 1; }
      - name: Lint
        shell: bash
        run: |
          npm run lint 2>&1 | tee out.txt || { echo "::error title=Lint::$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' out.txt | head -c 30000)"; exit 1; }
      - name: Tests
        shell: bash
        run: |
          npm test -- --ci 2>&1 | tee out.txt || { echo "::error title=Tests::$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' out.txt | head -c 30000)"; exit 1; }
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

  sql:
    # Rejoue toutes les migrations sur un Postgres jetable et exécute les scénarios SQL.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Scénarios SQL
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        shell: bash
        run: |
          chmod +x supabase/tests/run.sh
          ./supabase/tests/run.sh | tee sql-report.txt
          if grep -qE "ÉCHEC|ECHEC" sql-report.txt; then exit 1; fi
